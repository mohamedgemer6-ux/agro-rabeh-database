function uniq(k){return [...new Set(DATA.map(x=>x[k]).filter(x=>x&&x!=='غير متاح'))].sort((a,b)=>a.localeCompare(b,'ar'))}

function filtered(){
 const q=$('q').value.trim().toLowerCase(),tier=$('tier').value,gov=$('gov').value,cat=$('cat').value,st=$('status').value;
 return DATA.filter(x=>{
  const hay=[x.name,x.category,x.specialty,x.gov,x.city,x.account,x.title,x.topics,x.style].join(' ').toLowerCase();

 }).sort((a,b)=>b.score-a.score)
}
function render(){
 const a=filtered(); $('nAll').textContent=a.length; $('nA').textContent=a.filter(x=>x.tier==='Tier A'||x.tier==='Tier A+').length;
